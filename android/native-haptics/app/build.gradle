plugins {
 id "com.android.application"
}
android {
 namespace "org.agsa.simulator"
 compileSdk 35

 defaultConfig {
  applicationId "org.agsa.simulator"
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName "0.1-native-haptics-test"
 }

 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }

 buildTypes {
  release {
   minifyEnabled false
  }
 }
}
dependencies {
 implementation "androidx.webkit:webkit:1.14.0"
}
