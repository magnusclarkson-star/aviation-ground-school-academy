name: AI Instructor Browser Tests
on:
  push:
    branches: [main]
    paths:
      - 'ai-instructor.html'
      - 'ai-instructor.css'
      - 'ai-instructor.js'
      - 'ai-instructor-lessons.js'
      - 'ai-instructor-progress.js'
      - 'ai-instructor-curriculum.js'
      - 'ground-school-modules.html'
      - 'ground-school-modules.css'
      - 'ground-school-modules.js'
      - 'ground-school-modules-ui.js'
      - 'academy-coursebook.html'
      - 'academy-coursebook.css'
      - 'academy-coursebook*.js'
      - 'scripts/test-academy-coursebook-depth-browser.mjs'
      - 'scripts/test-ground-school-modules.mjs'
      - 'scripts/test-ground-school-modules-browser.mjs'
      - 'curriculum-review.html'
      - 'curriculum-review.js'
      - 'curriculum-review-model.js'
      - 'scripts/test-curriculum.mjs'
      - 'scripts/test-ai-instructor-progress.mjs'
      - 'scripts/test-ai-instructor.mjs'
      - 'scripts/test-ai-instructor-browser.mjs'
      - '.github/workflows/ai-instructor-browser.yml'
  pull_request:
    paths:
      - 'ai-instructor.html'
      - 'ai-instructor.css'
      - 'ai-instructor.js'
      - 'ai-instructor-lessons.js'
      - 'ai-instructor-progress.js'
      - 'ai-instructor-curriculum.js'
      - 'ground-school-modules.html'
      - 'ground-school-modules.css'
      - 'ground-school-modules.js'
      - 'ground-school-modules-ui.js'
      - 'academy-coursebook.html'
      - 'academy-coursebook.css'
      - 'academy-coursebook*.js'
      - 'scripts/test-academy-coursebook-depth-browser.mjs'
      - 'scripts/test-ground-school-modules.mjs'
      - 'scripts/test-ground-school-modules-browser.mjs'
      - 'curriculum-review.html'
      - 'curriculum-review.js'
      - 'curriculum-review-model.js'
      - 'scripts/test-curriculum.mjs'
      - 'scripts/test-ai-instructor-progress.mjs'
      - 'scripts/test-ai-instructor.mjs'
      - 'scripts/test-ai-instructor-browser.mjs'
      - '.github/workflows/ai-instructor-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guided-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ai-instructor-curriculum.js
      - run: node --check curriculum-review-model.js
      - run: node --check curriculum-review.js
      - run: node scripts/test-curriculum.mjs
      - run: node --check ai-instructor-lessons.js
      - run: node --check ai-instructor.js
      - run: node --check ai-instructor-progress.js
      - run: node scripts/test-ai-instructor-progress.mjs
      - run: node scripts/test-ai-instructor.mjs
      - run: node --check ground-school-modules.js
      - run: node --check ground-school-modules-ui.js
      - run: node scripts/test-ground-school-modules.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/test-ai-instructor-browser.mjs
      - run: node scripts/test-ground-school-modules-browser.mjs
      - run: node scripts/test-academy-coursebook-depth-browser.mjs
