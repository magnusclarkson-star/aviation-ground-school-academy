# TEMPORARY: lockfile generation on a trusted GitHub-hosted npm runner.
# Removed from the feature branch once the generated lockfile is committed.
name: Private Academy temporary npm lockfile generation
on:
  push:
    branches:
      - feature/private-runtime-reproducible-package-20261114
    paths:
      - '.github/workflows/private-lockfile-temporary.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-runtime-reproducible-package-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Generate pinned transitive dependencies and verify clean install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix academy-secure
          npm ci --ignore-scripts --no-audit --no-fund --prefix academy-secure
      - name: Commit generated lockfile back to this trusted feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academy-secure/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already committed'
          else
            git commit -m 'chore: pin private Academy dependency lockfile'
            git push origin HEAD:feature/private-runtime-reproducible-package-20261114
          fi
