name: Check Academy Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
      - run: node --check academy-brand.js
      - run: node --check flight-lab-v2.js
      - run: node scripts/test-flight-lab.mjs
      - run: node --check cockpit-v3-model.js
      - run: node --check cockpit-v3.js
      - run: node scripts/test-cockpit-v3.mjs
      - run: node --check cockpit-v3-focus.js
      - run: node --check cockpit-v3-mission.js
      - run: node scripts/test-cockpit-mission.mjs
      - run: node --check cockpit-v3-skills.js
      - run: node scripts/test-cockpit-skills.mjs
      - run: node --check cockpit-v3-coach.js
      - run: node --check cockpit-v3-live-coach.js
      - run: node scripts/test-cockpit-live-cues.mjs
      - run: node --check cockpit-v3-journal.js
      - run: node scripts/test-cockpit-coach-journal.mjs
      - run: node scripts/test-accreditation-readiness.mjs
      - run: node --check instructor-review-model.js
      - run: node --check instructor-review.js
      - run: node scripts/test-instructor-review.mjs
      - run: node --check ai-instructor-curriculum.js
      - run: node --check curriculum-review-model.js
      - run: node --check curriculum-review.js
      - run: node scripts/test-curriculum.mjs
      - run: node --check ai-instructor-lessons.js
      - run: node --check ai-instructor.js
      - run: node --check ai-instructor-progress.js
      - run: node scripts/test-ai-instructor-progress.mjs
      - run: node scripts/test-ai-instructor.mjs
      - run: node --check ground-school-modules.js
      - run: node --check ground-school-modules-ui.js
      - run: node scripts/test-ground-school-modules.mjs
      - run: node --check flight-sim-model.js
      - run: node --check flight-sim-environment.js
      - run: node scripts/test-flight-sim-environment.mjs
      - run: node --check flight-sim-haptics.js
      - run: node --check flight-sim-scenery.js
      - run: node --check flight-sim-3d.js
      - run: node scripts/test-flight-sim-3d.mjs
      - run: node --check flight-sim-aircraft-systems.js
      - run: node scripts/test-flight-sim-aircraft-systems.mjs
      - run: node --check flight-sim.js
      - run: node scripts/test-flight-sim-model.mjs
      - run: node scripts/test-flight-sim-haptics.mjs
      - run: node --check flight-sim-instruments.js
      - run: node --check flight-sim-guidance.js
      - run: node scripts/test-flight-sim-instruments.mjs
      - run: node scripts/test-flight-sim-guidance.mjs
      - run: node --check flight-sim-gamepad.js
      - run: node --check flight-sim-gamepad-ui.js
      - run: node scripts/test-flight-sim-gamepad.mjs
