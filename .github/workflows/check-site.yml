name: Check Academy Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The V3 preview is an isolated, self-contained Three.js bundle.
      # Pinned dependencies are build-time only and are never deployed.
      - name: Install pinned V3 scene-graph build tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund three@0.180.0 esbuild@0.25.12 sharp@0.35.5
      - run: node scripts/build-flight-sim-v3.mjs
      - run: node scripts/build-public-certificate-previews.mjs assets/certificate-previews
      - run: node scripts/check-site.mjs
      - run: node --check academy-brand.js
      - run: node --check flight-lab-v2.js
      - run: node scripts/test-flight-lab.mjs
      - run: node --check cockpit-v3-model.js
      - run: node --check cockpit-v3.js
      - run: node scripts/test-cockpit-v3.mjs
      - run: node --check cockpit-v3-focus.js
      - run: node --check cockpit-v3-mission.js
      - run: node scripts/test-cockpit-mission.mjs
      - run: node --check cockpit-v3-skills.js
      - run: node scripts/test-cockpit-skills.mjs
      - run: node --check cockpit-v3-coach.js
      - run: node --check cockpit-v3-live-coach.js
      - run: node scripts/test-cockpit-live-cues.mjs
      - run: node --check cockpit-v3-journal.js
      - run: node scripts/test-cockpit-coach-journal.mjs
      - run: node scripts/test-accreditation-readiness.mjs
      - run: node --check instructor-review-model.js
      - run: node --check instructor-review.js
      - run: node scripts/test-instructor-review.mjs
      - run: node --check ai-instructor-curriculum.js
      - run: node --check curriculum-review-model.js
      - run: node --check curriculum-review.js
      - run: node scripts/test-curriculum.mjs
      - run: node --check ai-instructor-lessons.js
      - run: node --check ai-instructor.js
      - run: node --check ai-instructor-progress.js
      - run: node scripts/test-ai-instructor-progress.mjs
      - run: node scripts/test-ai-instructor.mjs
      - run: node --check ground-school-modules.js
      - run: node --check ground-school-modules-ui.js
      - run: node scripts/test-ground-school-modules.mjs
      - run: node --check academy-coursebook-data.js
      - run: node --check academy-coursebook.js
      - run: node scripts/test-academy-coursebook.mjs
      - run: node --check academy-orientation-safety-lab-data.js
      - run: node --check academy-orientation-safety-lab.js
      - run: node scripts/test-academy-orientation-safety-lab.mjs
      - run: node --check academy-aircraft-identification-data.js
      - run: node --check academy-aircraft-identification-ui.js
      - run: node scripts/test-academy-aircraft-identification.mjs
      - run: node --check academy-aerodynamics-practical-data.js
      - run: node --check academy-aerodynamics-practical-ui.js
      - run: node scripts/test-academy-aerodynamics-practical.mjs
      - run: node scripts/test-academy-in-app-notes.mjs
      - run: node --check academy-coursebook-depth-a.js
      - run: node --check academy-coursebook-depth-b1.js
      - run: node --check academy-coursebook-depth-b2.js
      - run: node --check academy-coursebook-depth-model.js
      - run: node --check academy-coursebook-depth-ui.js
      - run: node scripts/test-academy-coursebook-depth.mjs
      - run: node --check academy-coursebook-illustrations.js
      - run: node --check academy-coursebook-pictorial-ui.js
      - run: node scripts/test-academy-coursebook-illustrations.mjs
      - run: node --check academy-coursebook-professional-media.js
      - run: node --check academy-coursebook-professional-ui.js
      - run: node --check academy-approved-visuals.js
      - run: node --check academy-approved-visuals-ui.js
