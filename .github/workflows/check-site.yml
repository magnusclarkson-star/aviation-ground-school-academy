name: Check Academy Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
      - run: node --check academy-brand.js
      - run: node --check flight-lab-v2.js
      - run: node scripts/test-flight-lab.mjs
