name: Private Academy ATO Governance and Records
on:
  pull_request:
    paths:
      - 'academy-secure/**'
      - 'docs/SLCAA-ATO-CERTIFICATION-DOSSIER.md'
      - 'docs/SLCAA-PREAPPLICATION-INQUIRY-DRAFT.md'
      - 'standards-readiness.html'
      - 'infra/render-private-staging.yaml'
      - 'docs/ACADEMY-RENDER-PRIVATE-STAGING.md'
      - 'scripts/test-render-private-staging.mjs'
      - '.github/workflows/ato-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'academy-secure/**'
      - 'infra/render-private-staging.yaml'
      - 'docs/ACADEMY-RENDER-PRIVATE-STAGING.md'
      - 'scripts/test-render-private-staging.mjs'
      - '.github/workflows/ato-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated private PDF and PostgreSQL dependencies
        run: npm ci --prefix academy-secure --ignore-scripts --no-audit --no-fund
      - run: node --check academy-secure/policy.mjs
      - run: node --check academy-secure/auth.mjs
      - run: node --check academy-secure/staff-mfa.mjs
      - run: node --check academy-secure/mfa-routes.mjs
      - run: node --check academy-secure/server.mjs
      - run: node --check academy-secure/deployment-preflight.mjs
      - run: node --test scripts/test-render-private-staging.mjs
      - run: node --check academy-secure/bootstrap-admin.mjs
      - run: node --check academy-secure/portal.js
      - run: node --check academy-secure/fees-policy.mjs
      - run: node --check academy-secure/finance-overview.mjs
      - run: node --check academy-secure/fees-routes.mjs
      - run: node --check academy-secure/fees-portal.js
      - run: node --check academy-secure/signature-vault.mjs
      - run: node --check academy-secure/signature-routes.mjs
      - run: node --check academy-secure/signature-portal.js
      - run: node --check academy-secure/document-pdf.mjs
      - run: node --check academy-certificate-core.mjs
      - run: node --check academy-certificate-eligibility.mjs
      - run: node --check academy-certificate-ui.mjs
      - run: node --check academy-secure/document-routes.mjs
      - run: node --check academy-secure/document-portal.js
      - run: node --check academy-secure/transcript-pdf.mjs
      - run: node --check academy-secure/master-artwork.mjs
      - run: node --check academy-secure/master-artwork-portal.js
      - run: node --check academy-secure/original-certificate-pdf.mjs
      - run: node --test academy-secure/tests/policy.test.mjs academy-secure/tests/auth.test.mjs academy-secure/tests/staff-mfa.test.mjs academy-secure/tests/deployment-preflight.test.mjs academy-secure/tests/closed-portal.test.mjs academy-secure/tests/fees-policy.test.mjs academy-secure/tests/finance-overview.test.mjs academy-secure/tests/signature-vault.test.mjs academy-secure/tests/document.test.mjs academy-secure/tests/master-artwork.test.mjs
  private-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated private runtime from its own context
        run: docker build --file academy-secure/Dockerfile --tag agsa-private:ci academy-secure
      - name: Confirm original certificate files and test secrets are not packaged
        run: |
          docker run --rm --entrypoint /bin/sh agsa-private:ci -ec '
            test -f /srv/academy-private/server.mjs
            test -f /srv/academy-private/package-lock.json
            test ! -e /srv/academy-private/.env.example
            test ! -e /srv/academy-private/schema.sql
            test ! -e /srv/assets/certificates
            test ! -e /srv/academy-private/tests
            test "$(id -u)" = 1000
          '
      - name: Closed image liveness and fail-closed API smoke test
        run: |
          set -euo pipefail
          docker run -d --name agsa-private-smoke \
            -e NODE_ENV=test -e ACADEMY_ACCESS_STATE=closed \
            -e ACADEMY_ORIGIN=http://127.0.0.1:8787 \
            -e DATABASE_URL=postgresql://test:unused@127.0.0.1:54329/unreachable \
            -p 127.0.0.1:18887:8787 agsa-private:ci
          trap 'docker rm -f agsa-private-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18887/api/health -o /tmp/agsa-health; then break; fi
            sleep 0.25
          done
          grep -q '"status":"ok"' /tmp/agsa-health
          status=$(curl -sS -o /tmp/agsa-ready -w '%{http_code}' http://127.0.0.1:18887/api/ready)
          test "$status" = 503
          grep -q 'PRIVATE_PORTAL_CLOSED' /tmp/agsa-ready
          status=$(curl -sS -o /tmp/agsa-portal -w '%{http_code}' http://127.0.0.1:18887/)
          test "$status" = 503
  private-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: academy_test
          POSTGRES_DB: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy_test -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://academy_test:test-only-password@127.0.0.1:5432/academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private-service dependency for isolated CI
        run: npm ci --prefix academy-secure --ignore-scripts --no-audit --no-fund
      - name: Execute PostgreSQL-backed integration and authority gate checks
        run: node --test academy-secure/tests/integration.test.mjs
      - name: Rehearse restore of synthetic private Academy records
        env:
          CI: 'true'
          ACADEMY_BACKUP_TEST_FIXTURE: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: academy_test
          PGPASSWORD: test-only-password
          PGDATABASE: academy_test
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          bash academy-secure/scripts/test-backup-restore.sh
