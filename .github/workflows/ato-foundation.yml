name: Private Academy ATO Governance and Records
on:
  pull_request:
    paths:
      - 'academy-secure/**'
      - 'docs/SLCAA-ATO-CERTIFICATION-DOSSIER.md'
      - 'docs/SLCAA-PREAPPLICATION-INQUIRY-DRAFT.md'
      - 'standards-readiness.html'
      - '.github/workflows/ato-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'academy-secure/**'
      - '.github/workflows/ato-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check academy-secure/policy.mjs
      - run: node --check academy-secure/auth.mjs
      - run: node --check academy-secure/server.mjs
      - run: node --check academy-secure/bootstrap-admin.mjs
      - run: node --check academy-secure/portal.js
      - run: node --test academy-secure/tests/policy.test.mjs academy-secure/tests/auth.test.mjs
  private-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: academy_test
          POSTGRES_DB: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy_test -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://academy_test:test-only-password@127.0.0.1:5432/academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private-service dependency for isolated CI
        run: npm install --prefix academy-secure --ignore-scripts --no-audit --no-fund
      - name: Execute PostgreSQL-backed integration and authority gate checks
        run: node --test academy-secure/tests/integration.test.mjs
