name: Review Workbench Browser Tests
on:
  push:
    branches: [main]
    paths:
      - 'instructor-review.html'
      - 'instructor-review-model.js'
      - 'instructor-review.js'
      - 'scripts/test-instructor-review.mjs'
      - 'scripts/test-instructor-review-browser.mjs'
      - '.github/workflows/review-workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-instructor-review.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/test-instructor-review-browser.mjs
