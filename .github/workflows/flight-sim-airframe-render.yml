name: Imported Aircraft WebGL Visual Smoke
on:
  pull_request:
    paths:
      - 'flight-sim-3d.js'
      - 'flight-sim.html'
      - 'flight-sim-real-airframes.js'
      - 'flight-sim-c172-airframe.js'
      - 'flight-sim-real-r44.js'
      - 'flight-sim-airframe-geometry.js'
      - 'flight-sim-f22-airframe.js'
      - 'flight-sim-f35-airframe.js'
      - 'flight-sim-su37-airframe.js'
      - 'flight-sim-typhoon-airframe.js'
      - 'scripts/test-flight-sim-typhoon.mjs'
      - 'scripts/test-flight-sim-typhoon-browser.mjs'
      - 'scripts/test-flight-sim-su37.mjs'
      - 'scripts/test-flight-sim-su37-browser.mjs'
      - 'assets/aircraft/f35b-fg-exterior.json'
      - 'scripts/test-flight-sim-f35-browser.mjs'
      - 'scripts/test-flight-sim-fighter-gear-rig.mjs'
      - 'assets/aircraft/f22-fguk-exterior.json'
      - 'scripts/test-flight-sim-f22-browser.mjs'
      - 'scripts/test-flight-sim-five-fighters-browser.mjs'
      - 'scripts/test-flight-sim-source-exterior-loading-browser.mjs'
      - 'assets/aircraft/**'
      - 'tests/simulator-v2-real-r44.test.cjs'
      - 'tests/simulator-v2-real-airframes.test.cjs'
      - 'tests/simulator-v2-molen-c172.test.cjs'
      - 'scripts/test-flight-sim-real-airframes-browser.mjs'
      - 'scripts/test-flight-sim-mobile-airframes-browser.mjs'
      - '.github/workflows/flight-sim-airframe-render.yml'
  push:
    branches: [main]
    paths:
      - 'flight-sim-3d.js'
      - 'flight-sim.html'
      - 'flight-sim-real-airframes.js'
      - 'flight-sim-c172-airframe.js'
      - 'flight-sim-real-r44.js'
      - 'flight-sim-airframe-geometry.js'
      - 'flight-sim-f22-airframe.js'
      - 'flight-sim-f35-airframe.js'
      - 'flight-sim-su37-airframe.js'
      - 'flight-sim-typhoon-airframe.js'
      - 'scripts/test-flight-sim-typhoon.mjs'
      - 'scripts/test-flight-sim-typhoon-browser.mjs'
      - 'scripts/test-flight-sim-su37.mjs'
      - 'scripts/test-flight-sim-su37-browser.mjs'
      - 'assets/aircraft/f35b-fg-exterior.json'
      - 'scripts/test-flight-sim-f35-browser.mjs'
      - 'scripts/test-flight-sim-fighter-gear-rig.mjs'
      - 'assets/aircraft/f22-fguk-exterior.json'
      - 'scripts/test-flight-sim-f22-browser.mjs'
      - 'scripts/test-flight-sim-five-fighters-browser.mjs'
      - 'scripts/test-flight-sim-source-exterior-loading-browser.mjs'
      - 'assets/aircraft/**'
      - 'tests/simulator-v2-real-r44.test.cjs'
      - 'tests/simulator-v2-real-airframes.test.cjs'
      - 'tests/simulator-v2-molen-c172.test.cjs'
      - 'scripts/test-flight-sim-real-airframes-browser.mjs'
      - 'scripts/test-flight-sim-mobile-airframes-browser.mjs'
      - '.github/workflows/flight-sim-airframe-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  airframes:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate imported-model geometry and overlay decisions
        run: |
          node --test tests/simulator-v2-real-r44.test.cjs
          node --test tests/simulator-v2-molen-c172.test.cjs
          node --test tests/simulator-v2-real-airframes.test.cjs
          node scripts/test-flight-sim-fighter-gear-rig.mjs
      - name: Install isolated WebGL browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit playwright@1.56.1
          npx playwright install chromium
      - name: Render actual R44 and C172 across outside and 360-degree cameras
        run: node scripts/test-flight-sim-real-airframes-browser.mjs
      - name: Capture authentic C172 and R44 in mobile portrait and landscape
        run: node scripts/test-flight-sim-mobile-airframes-browser.mjs
      - name: Prove imported F-22 source geometry in actual browser views
        run: node scripts/test-flight-sim-f22-browser.mjs
      - name: Prove imported F-35B source geometry in actual browser views
        run: node scripts/test-flight-sim-f35-browser.mjs
      - name: Prove GPL source Su-37 geometry and control deflection in mobile WebGL
        run: |
          node scripts/test-flight-sim-su37.mjs
          node scripts/test-flight-sim-su37-browser.mjs
      - name: Prove real Typhoon source canards and landing gear in mobile WebGL
        run: |
          node scripts/test-flight-sim-typhoon.mjs
          node scripts/test-flight-sim-typhoon-browser.mjs
      - name: Verify all five fighters in portrait and landscape with visible gear and controls
        run: node scripts/test-flight-sim-five-fighters-browser.mjs
      - name: Verify all four imported fighters never show obsolete chase-view meshes
        run: node scripts/test-flight-sim-source-exterior-loading-browser.mjs
      - name: Save real-aircraft preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imported-airframe-webgl-previews
          path: |
            artifacts/real-r44-*.png
            artifacts/real-c172-*.png
            artifacts/mobile-*-inspector.png
            artifacts/real-f22-*.png
            artifacts/real-f35-*.png
            artifacts/real-su37-*.png
            artifacts/real-typhoon-*.png
            artifacts/mobile-fighter-*.png
          if-no-files-found: ignore
          retention-days: 14
