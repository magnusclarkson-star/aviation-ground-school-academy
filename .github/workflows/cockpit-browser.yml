name: Browser Test V3 Cockpit
on:
  push:
    branches: [main]
    paths:
      - 'cockpit-v3.html'
      - 'cockpit-v3.js'
      - 'cockpit-v3-model.js'
      - 'scripts/test-cockpit-browser.mjs'
      - '.github/workflows/cockpit-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/test-cockpit-browser.mjs
