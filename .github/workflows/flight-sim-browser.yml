      - '.github/workflows/flight-sim-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immersive-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate simulator source
        run: |
          node --check flight-sim.js
          node --check flight-sim-model.js
          node --check flight-sim-aerodynamics.js
          node --check flight-sim-loading.js
          node --check flight-sim-exercises.js
          node --check flight-sim-instructor-voice.js
          node --check flight-sim-environment.js
          node --check flight-sim-haptics.js
          node --check flight-sim-scenery.js
          node --check flight-sim-3d.js
          node --check flight-sim-airport-detail.js
          node --check flight-sim-aircraft-systems.js
          node --check flight-sim-instruments.js
          node --check flight-sim-cockpit.js
          node --check flight-sim-navigation.js
          node --check flight-sim-switchgear.js
          node --check flight-sim-focus.js
          node --check flight-sim-guidance.js
          node --check flight-sim-gamepad.js
          node --check flight-sim-gamepad-ui.js
      - name: Test deterministic flight model
        run: |
          node scripts/test-flight-sim-model.mjs
          node scripts/test-flight-sim-aerodynamics.mjs
          node scripts/test-flight-sim-loading.mjs
          node scripts/test-flight-sim-exercises.mjs
          node scripts/test-flight-sim-instructor-voice.mjs
          node scripts/test-flight-sim-environment.mjs
          node scripts/test-flight-sim-3d.mjs
          node scripts/test-flight-sim-airport-detail.mjs
          node scripts/test-flight-sim-aircraft-systems.mjs
      - name: Test optional vibration
        run: node scripts/test-flight-sim-haptics.mjs
      - name: Test integrated glass instruments and guidance
        run: |
          node scripts/test-flight-sim-instruments.mjs
          node scripts/test-flight-sim-cockpit.mjs
          node scripts/test-flight-sim-navigation.mjs
          node scripts/test-flight-sim-switchgear.mjs
          node scripts/test-flight-sim-guidance.mjs
      - name: Test optional physical controller mapping
        run: node scripts/test-flight-sim-gamepad.mjs
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test desktop and simultaneous touch controls
        run: |
          node scripts/test-flight-sim-browser.mjs
          node scripts/test-flight-integrated-cockpit-browser.mjs
          node scripts/test-flight-switchgear-browser.mjs
          node scripts/test-flight-focus-browser.mjs
          node scripts/test-flight-cockpit-zoom-browser.mjs
          node scripts/test-flight-navigation-browser.mjs
          node scripts/test-flight-sim-gamepad-browser.mjs
          node scripts/test-flight-sim-environment-browser.mjs
          node scripts/test-flight-sim-3d-browser.mjs
          node scripts/test-flight-sim-airport-detail-browser.mjs
          node scripts/test-flight-sim-aircraft-systems-browser.mjs
          node scripts/test-flight-sim-aerodynamics-browser.mjs
          node scripts/test-flight-sim-loading-browser.mjs
          node scripts/test-flight-sim-exercises-browser.mjs
          node scripts/test-flight-sim-instructor-voice-browser.mjs
