name: Training API Security Checks
on:
  push:
    branches: [main]
    paths:
      - 'services/training-api/**'
      - '.github/workflows/training-api.yml'
  pull_request:
    paths:
      - 'services/training-api/**'
      - '.github/workflows/training-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agsa_test
          POSTGRES_PASSWORD: agsa_test_ephemeral_ci_only
          POSTGRES_DB: agsa_training_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agsa_test -d agsa_training_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      PGSSL_MODE: disable
      DATABASE_URL: postgresql://agsa_test:agsa_test_ephemeral_ci_only@127.0.0.1:5432/agsa_training_test
      AGSA_TEST_DATABASE_URL: postgresql://agsa_test:agsa_test_ephemeral_ci_only@127.0.0.1:5432/agsa_training_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax
        run: |
          for file in services/training-api/src/*.mjs services/training-api/scripts/*.mjs services/training-api/tests/*.mjs; do
            node --check "$file"
          done
      - name: Install the pinned PostgreSQL client
        run: npm install --prefix services/training-api --no-package-lock --no-audit --ignore-scripts
      - name: Generate one-time reviewed dependency lock candidate
        run: |
          npm install --prefix services/training-api --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('node:fs');console.log('AGSA_LOCK_BEGIN');console.log(fs.readFileSync('services/training-api/package-lock.json').toString('base64'));console.log('AGSA_LOCK_END')"
      - name: Migrate isolated CI database
        run: node services/training-api/scripts/migrate.mjs
      - name: Test authentication isolation and real database behavior
        run: node --test services/training-api/tests/*.test.mjs
      - name: Install browser test dependency
        run: npm install --prefix services/training-api --no-save --no-package-lock --no-audit --ignore-scripts playwright@1.56.1
      - name: Install Chromium for browser tests
        working-directory: services/training-api
        run: npx playwright install chromium
      - name: Test the private student and instructor portal
        run: node services/training-api/tests/portal.browser.mjs
