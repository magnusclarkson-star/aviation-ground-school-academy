name: Flight Simulator V2 reliability
on:
  pull_request:
    paths:
      - 'flight-sim-circuit-guide.js'
      - 'flight-sim-model.js'
      - 'flight-sim-airframe-geometry.js'
      - 'tests/simulator-v2-aircraft-fidelity.test.cjs'
      - 'flight-sim-touch-pedals.js'
      - 'tests/simulator-v2-circuit-pedals.test.cjs'
      - 'tests/simulator-v2-flight-sequence.test.cjs'
      - 'flight-sim-windsocks.js'
      - 'flight-sim-scenery.js'
      - 'flight-sim-countryside.js'
      - 'flight-sim-exterior-2d.js'
      - 'tests/simulator-v2-terrain-framing.test.cjs'
      - 'flight-sim-3d.js'
      - 'flight-sim-real-airframes.js'
      - 'flight-sim-r44-airframe.js'
      - 'tests/simulator-v2-real-r44.test.cjs'
      - 'assets/aircraft/**'
      - 'tests/simulator-v2-real-airframes.test.cjs'
      - 'flight-sim-ground-traffic.js'
      - 'tests/simulator-v2-ground-traffic.test.cjs'
      - 'flight-sim.html'
      - 'tests/simulator-v2-windsocks.test.cjs'
      - 'scripts/test-flight-sim-browser.mjs'
      - '.github/workflows/flight-sim-v2-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'flight-sim-circuit-guide.js'
      - 'flight-sim-model.js'
      - 'flight-sim-airframe-geometry.js'
      - 'tests/simulator-v2-aircraft-fidelity.test.cjs'
      - 'flight-sim-touch-pedals.js'
      - 'tests/simulator-v2-circuit-pedals.test.cjs'
      - 'tests/simulator-v2-flight-sequence.test.cjs'
      - 'flight-sim-windsocks.js'
      - 'flight-sim-scenery.js'
      - 'flight-sim-countryside.js'
      - 'flight-sim-exterior-2d.js'
      - 'tests/simulator-v2-terrain-framing.test.cjs'
      - 'flight-sim-3d.js'
      - 'flight-sim-real-airframes.js'
      - 'flight-sim-r44-airframe.js'
      - 'tests/simulator-v2-real-r44.test.cjs'
      - 'assets/aircraft/**'
      - 'tests/simulator-v2-real-airframes.test.cjs'
      - 'flight-sim-ground-traffic.js'
      - 'tests/simulator-v2-ground-traffic.test.cjs'
      - 'flight-sim.html'
      - 'tests/simulator-v2-windsocks.test.cjs'
      - 'scripts/test-flight-sim-browser.mjs'
      - '.github/workflows/flight-sim-v2-reliability.yml'
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check flight-sim-circuit-guide.js
      - run: node --check flight-sim-touch-pedals.js
      - run: node --check flight-sim-model.js
      - run: node --check flight-sim-airframe-geometry.js
      - run: node --check flight-sim-windsocks.js
      - run: node --check flight-sim-scenery.js
      - run: node --check flight-sim-3d.js
      - run: node --check flight-sim-real-airframes.js
      - run: node --check flight-sim-r44-airframe.js
      - run: node --check flight-sim-countryside.js
      - run: node --check flight-sim-exterior-2d.js
      - run: node --check flight-sim-ground-traffic.js
      - run: node --check scripts/test-flight-sim-browser.mjs
      - run: node --test tests/simulator-v2-circuit-pedals.test.cjs tests/simulator-v2-flight-sequence.test.cjs tests/simulator-v2-windsocks.test.cjs tests/simulator-v2-aircraft-fidelity.test.cjs tests/simulator-v2-ground-traffic.test.cjs tests/simulator-v2-terrain-framing.test.cjs
      - run: node --test tests/simulator-v2-real-airframes.test.cjs tests/simulator-v2-real-r44.test.cjs
      - run: node scripts/test-flight-sim-model.mjs
      - run: node scripts/test-flight-sim-airframes.mjs
