name: Deploy Academy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Let a Pages deployment finish: cancelling mid-deploy leaves a stale
  # in-progress Pages request and the next commit cannot publish.
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the allowlisted public website (never publish private backend files)
        run: node scripts/build-pages.mjs
      - name: Verify private sources are absent from deployment
        run: node scripts/test-pages-package.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
