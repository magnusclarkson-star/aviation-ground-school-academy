name: Deploy Academy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Let a Pages deployment finish: cancelling mid-deploy leaves a stale
  # in-progress Pages request and the next commit cannot publish.
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone V3 preview with pinned Three.js
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund three@0.180.0 esbuild@0.25.12 sharp@0.35.5
          node scripts/build-flight-sim-v3.mjs
      - name: Build the allowlisted public website (never publish private backend files)
        run: node scripts/build-pages.mjs
      - name: Verify private sources are absent from deployment
        run: node scripts/test-pages-package.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages
      - name: Wait for GitHub Pages artifact to become visible to deployment API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              echo "Single github-pages artifact is indexed."
              exit 0
            fi
            echo "Artifact indexing attempt ${attempt}: count=${count}"
            sleep 3
          done
          echo "Pages artifact was not indexed as a unique upload."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages serves this exact simulator and its real model files
        env:
          AGSA_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-simulator.mjs
